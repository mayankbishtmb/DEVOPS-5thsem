name: Building Blocks

on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              run: echo "hello,World!"

    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: |
                echo "This step will fail"
                exit 1
            - name: Say goodbye
              if: always()
              run: echo "goodbye,World!"